[project]
name = "ytinfo"
version = "0.1.2b1"
description = "Tool for get info from youtube."
readme = "README.md"
authors = [
    { name = "Yasyrev Andrei", email = "a.yasyrev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "google-api-python-client>=2.177.0",
    "pydantic>=2.11.7",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.coverage.paths]
source = ["src"]

[tool.coverage.run]
branch = true
source = ["ytinfo"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
extend-include = ["*.ipynb"]
indent-width = 4
line-length = 120

[tool.ruff.lint]
explicit-preview-rules = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "black[jupyter]>=25.1.0",
    "coverage[toml]>=7.10.0",
    "flake8>=7.3.0",
    "isort>=6.0.1",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "ruff>=0.12.5",
]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]
